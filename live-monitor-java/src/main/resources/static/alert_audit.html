<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>告警审计 - Live Monitor</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/alert-audit.css">
  <script src="/vendor/lucide/lucide.min.js"></script>
  <script src="/vendor/echarts/echarts.min.js"></script>
  <script src="/webjars/marked/12.0.2/marked.min.js"></script>
  <script src="/webjars/dompurify/3.1.6/dist/purify.min.js"></script>
</head>
<body data-page="alert-audit">
<header class="topbar">
  <a class="brand app-brand" href="/dashboard" aria-label="Live Monitor 首页">
    <span class="brand-mark app-brand-mark"><i data-lucide="activity"></i></span>
    <span class="app-brand-copy">
      <strong>Live Monitor</strong>
      <small>轻量事件驱动监控平台</small>
    </span>
  </a>
  <nav class="nav">
    <a href="/dashboard">监控首页</a>
    <a href="/hosts">主机维护</a>
    <a href="/alerts/settings">告警设置</a>
    <a class="active" href="/alerts/audit">告警审计</a>
  </nav>
</header>

<main class="page alert-audit-page">
  <section class="alert-audit-hero">
    <h1>告警通知审计</h1>
    <p>展示系统对外发送的告警通知记录，包含成功与失败明细</p>
  </section>

  <section class="panel">

    <div class="audit-metrics">
      <div class="audit-metric total">
        <div class="label">今日通知总数</div>
        <div class="value" id="metricTodayTotal">-</div>
      </div>
      <div class="audit-metric success">
        <div class="label">今日成功</div>
        <div class="value" id="metricTodaySuccess">-</div>
      </div>
      <div class="audit-metric failed">
        <div class="label">今日失败</div>
        <div class="value" id="metricTodayFailed">-</div>
      </div>
      <div class="audit-metric">
        <div class="label">当前筛选总数</div>
        <div class="value" id="metricTotal">-</div>
      </div>
    </div>

    <div class="audit-trend-card">
      <header>
        <h2>每日发送量趋势</h2>
        <select id="trendDaysSelect" title="选择趋势区间">
          <option value="7">最近 7 天</option>
          <option value="14" selected>最近 14 天</option>
          <option value="30">最近 30 天</option>
          <option value="60">最近 60 天</option>
          <option value="90">最近 90 天</option>
        </select>
      </header>
      <div id="trendChart"></div>
    </div>

    <div class="audit-filters">
      <input id="filterQuery" type="search" placeholder="搜索服务名 / 集群 / 类型 / 消息" style="min-width:220px;">
      <select id="filterStatus">
        <option value="">全部状态</option>
        <option value="success">成功</option>
        <option value="failed">失败</option>
      </select>
      <label>开始 <input id="filterStart" type="datetime-local"></label>
      <label>结束 <input id="filterEnd" type="datetime-local"></label>
      <select id="filterPageSize">
        <option value="20">每页 20</option>
        <option value="50">每页 50</option>
        <option value="100">每页 100</option>
      </select>
      <button id="filterApplyBtn" type="button">查询</button>
      <button id="filterResetBtn" class="secondary" type="button">重置</button>
    </div>

    <div style="overflow:auto;">
      <table class="audit-table">
        <thead>
          <tr>
            <th style="width:60px;">ID</th>
            <th style="width:170px;">时间</th>
            <th>服务</th>
            <th style="width:120px;">类型</th>
            <th style="width:80px;">状态</th>
            <th>内容 / 错误</th>
          </tr>
        </thead>
        <tbody id="auditTableBody">
          <tr class="empty-row"><td colspan="6">加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pager">
      <span id="pagerInfo" style="color:#64748b; margin-right:8px;">-</span>
      <button id="pagerPrevBtn" type="button">上一页</button>
      <button id="pagerNextBtn" type="button">下一页</button>
    </div>
  </section>
</main>

<dialog id="auditDetailDialog" class="audit-detail-dialog" aria-labelledby="auditDetailTitle">
  <div class="audit-detail-head">
    <div>
      <h2 id="auditDetailTitle">通知详情</h2>
      <p id="auditDetailMeta"></p>
    </div>
    <button id="auditDetailCloseBtn" class="audit-dialog-close" type="button" title="关闭" aria-label="关闭">
      <i data-lucide="x"></i>
    </button>
  </div>
  <div id="auditDetailContent" class="audit-detail-content audit-markdown"></div>
</dialog>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/alert-audit.js"></script>
<script>if (window.lucide) { lucide.createIcons(); }</script>
</body>
</html>
